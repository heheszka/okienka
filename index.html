<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okienka na Studiach</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles/style1.css">
    <link rel="stylesheet" href="styles/style2.css">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="images/ikona-512.png">
</head>
<body>
    <!-- EKRAN 1: Główny (Okienka) -->
    <div id="ekran-okienka" class="ekran aktywny">
        <header>
            <h1>Kto ma okienko?</h1>
            <div id="zegar">--:--</div>
        </header>

        <div class="kontrolki">
            <button id="btn-auto" class="aktywny" onclick="ustawTydzien(null)">Aktualny tydzień</button>
            <button id="btn-parz" onclick="ustawTydzien('parzysty')">Parzysty</button>
            <button id="btn-nieparz" onclick="ustawTydzien('nieparzysty')">Nieparzysty</button>
        </div>

        <div id="lista-znajomych" class="lista"></div>
    </div>

    <!-- EKRAN 2: Plan / Odliczanie i Kalendarz -->
    <div id="ekran-drugi" class="ekran">
        <header>
            <h1>Kiedy kolejne chlanie?</h1>
        </header>
        
        <div class="karta-odliczanie">
            <div id="odliczanie-tytul" class="odliczanie-tytul">Brak nadchodzących imprez</div>
            <div id="licznik-dni" class="odliczanie-liczba">--</div>
            <div id="licznik-szczegoly" class="odliczanie-opis"></div>
        </div>

        <div class="kalendarz-karta">
            <div id="kalendarz-naglowek" class="kalendarz-naglowek">Miesiąc</div>
            <div class="kalendarz-dni-tygodnia">
                <span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>Sb</span><span>Nd</span>
            </div>
            <div id="kalendarz-siatka" class="kalendarz-siatka"></div>
            <div id="kalendarz-legenda" class="kalendarz-legenda"></div>
        </div>
    </div>



    <!-- EKRAN 3: Pusta zakładka -->
    <div id="ekran-trzeci" class="ekran">
        <header>
            <h1>Zakładka 3</h1>
        </header>
        <p style="color: #64748b;">67 i do pieca</p>
    </div>

    <!-- DOLNY PASEK NAWIGACJI -->
    <nav class="dolny-pasek">
        <button class="nav-btn aktywny" onclick="zmienEkran('ekran-okienka', this)">
            <span class="nav-ikona">🕒</span>
            <span>Okienka</span>
        </button>
        <button class="nav-btn" onclick="zmienEkran('ekran-drugi', this)">
            <span class="nav-ikona">📅</span>
            <span>Plan</span>
        </button>
        <button class="nav-btn" onclick="zmienEkran('ekran-trzeci', this)">
            <span class="nav-ikona">⚙️</span>
            <span>Inne</span>
        </button>
    </nav>

    <script src="plany.js"></script>
    <script src="app.js"></script>
    <script src="dodatkowe.js"></script>
    <script src="ui.js"></script>
    <script src="odliczanie.js"></script>
    <script src="odliczanie.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
        }
    </script>
</body>
</html>
